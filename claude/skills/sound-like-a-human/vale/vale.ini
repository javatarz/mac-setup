# Vale config for the sound-like-a-human skill. scripts/lint.py always passes
# this file with --config and --no-global, so no other .vale.ini can take over.
StylesPath = styles
MinAlertLevel = suggestion

# Replaces Vale's default list, so the defaults (code, tt) are repeated.
IgnoredScopes = code, tt, kbd, samp, text.frontmatter

# To add a synced rule package later, uncomment ONE line below, pin the release,
# run `vale sync --config vale/vale.ini`, and enable it per rule in the sections
# (for example `ai-tells = NO` then `ai-tells.ContrastiveFormulas = warning`).
# Not enabled yet: it needs the owner's decision.
# Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

# Every type. The wrapper pipes a draft in with --path=<type>/<name>.md.
[*.md]
BasedOnStyles = Voice
# Social only: see [social/*.md]. Slides only: StageDirection. Doc only: DecidedDate, DecidedReason.
Voice.NumeralsSocial = NO
Voice.SoftBut = NO
Voice.LinkTwice = NO
Voice.StageDirection = NO
Voice.DecidedDate = NO
Voice.DecidedReason = NO

# Paragraph-count rule only makes sense for long-form writing.
[{social,email,slides}/*.md]
BasedOnStyles = Voice
Voice.OneSentenceParagraph = NO

[doc/*.md]
BasedOnStyles = Voice
Voice.DecidedDate = suggestion
Voice.DecidedReason = suggestion

[slides/*.md]
BasedOnStyles = Voice
Voice.StageDirection = suggestion

# Social: numerals are a warning (characters count) and cover the start of a sentence.
[social/*.md]
BasedOnStyles = Voice
Voice.Numerals = NO
Voice.NumeralsSocial = warning
Voice.NumeralOne = warning
Voice.SoftBut = suggestion
Voice.LinkTwice = suggestion
