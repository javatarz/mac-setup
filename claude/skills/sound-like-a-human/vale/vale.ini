# Vale config for the sound-like-a-human skill. scripts/lint.py always passes
# this file with --config and --no-global, so no other .vale.ini can take over.
StylesPath = styles
MinAlertLevel = suggestion

# Replaces Vale's default list, so the defaults (code, tt) are repeated.
IgnoredScopes = code, tt, kbd, samp, text.frontmatter

# Third-party rules are vendored into styles/ by vendor.sh at pinned tags. There is no `Packages =`
# line, so Vale never fetches anything. Each package is switched off as a whole, then single rules
# are switched on below. Why each rule is on or off: docs/wip/writing-system/vale-tuning.md.
# Vale.Terms and Vale.Avoid read the Skill vocabulary (styles/config/vocabularies/Skill); the spelling
# rule is Voice.Spelling (en_GB), so Vale.Spelling and Vale.Repetition stay off.
Vocab = Skill

# Every type. The wrapper pipes a draft in with --path=<type>/<name>.md.
[*.md]
BasedOnStyles = Vale, Voice, ai-tells, Voices, Direct, Human, Std
Vale.Spelling = NO
Vale.Repetition = NO
Vale.Terms = error
Vale.Avoid = error

ai-tells = NO
ai-tells.AICompoundPhrases = error
ai-tells.EmDashUsage = error
ai-tells.StackedHedges = error
ai-tells.ExplainerLeads = error
ai-tells.ContrastiveFormulas = warning
ai-tells.FigurativeWins = warning
ai-tells.AbsoluteAssertions = warning
ai-tells.VagueAttributions = warning
ai-tells.IncompleteComparison = warning
ai-tells.UniversalObject = warning
ai-tells.FalseExclusivity = warning
ai-tells.NarrativePivots = warning
ai-tells.UrgencyInflation = warning
ai-tells.PromotionalPuffery = warning
ai-tells.StrategyBuzzwords = warning
ai-tells.ParticipialPadding = warning
ai-tells.ServesAsDodge = warning
ai-tells.DespiteChallenges = warning
ai-tells.UnpackExplore = warning
ai-tells.ListIntroductions = warning
ai-tells.StructureAnnouncements = warning
ai-tells.AnnouncementHeadings = warning
ai-tells.MarketingHeadings = warning
ai-tells.RhetoricalSelfAnswer = warning
ai-tells.AffirmativeFormulas = warning
ai-tells.FigurativeWorth = warning
ai-tells.FillerPhrases = suggestion
ai-tells.StackedAnaphora = suggestion
ai-tells.VerbTricolonDensity = suggestion
ai-tells.SelfReference = suggestion
ai-tells.SequencingMarkers = suggestion
ai-tells.OrganicConsequence = suggestion
ai-tells.HollowAcknowledgment = suggestion
ai-tells.FigurativeIdioms = suggestion
ai-tells.FigurativeBreeds = suggestion
ai-tells.FigurativeCasts = suggestion
ai-tells.FigurativeLends = suggestion
ai-tells.FigurativeRuns = suggestion
ai-tells.FigurativeSees = suggestion
ai-tells.FigurativeStrikes = suggestion
ai-tells.PointVerdict = suggestion
ai-tells.ShellNounCopula = suggestion
ai-tells.ConclusionMarkers = suggestion
ai-tells.ClosingPleasantries = suggestion

Voices = NO
Voices.BinaryContrast = warning
Voices.ThroatClearing = warning

Direct = NO
Direct.Hedging = error

Human = NO

Std = NO
Std.Punctuation.OxfordComma = warning
# Social only: see [social/*.md]. Slides only: StageDirection. Doc only: DecidedDate, DecidedReason.
Voice.NumeralsSocial = NO
Voice.SoftBut = NO
Voice.LinkTwice = NO
Voice.StageDirection = NO
Voice.DecidedDate = NO
Voice.DecidedReason = NO

# Paragraph-count rule only makes sense for long-form writing.
[{social,email,slides}/*.md]
BasedOnStyles = Voice
Voice.OneSentenceParagraph = NO

[doc/*.md]
BasedOnStyles = Voice
Voice.DecidedDate = suggestion
Voice.DecidedReason = suggestion

[slides/*.md]
BasedOnStyles = Voice
Voice.StageDirection = suggestion

# Social: numerals are a warning (characters count) and cover the start of a sentence.
[social/*.md]
BasedOnStyles = Voice
Voice.Numerals = NO
Voice.NumeralsSocial = warning
Voice.NumeralOne = warning
Voice.SoftBut = suggestion
Voice.LinkTwice = suggestion
