extends: occurrence
message: '"unleash" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:unleash)\b'
tests:
  - name: 'second use is flagged'
    input: "One unleash here.\n\nAnother unleash there."
    contains: 'Voice.RepeatedUnleash'
  - name: 'one use is fine'
    input: "One unleash here."
    absent: 'Voice.RepeatedUnleash'
