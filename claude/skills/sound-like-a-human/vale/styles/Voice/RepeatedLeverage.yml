extends: occurrence
message: '"leverage" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:leverage)\b'
tests:
  - name: 'second use is flagged'
    input: "One leverage here.\n\nAnother leverage there."
    contains: 'Voice.RepeatedLeverage'
  - name: 'one use is fine'
    input: "One leverage here."
    absent: 'Voice.RepeatedLeverage'
