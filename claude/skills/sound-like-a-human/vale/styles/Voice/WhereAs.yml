extends: substitution
message: 'Use "%s" instead of "%s".'
level: error
ignorecase: true
swap:
  'where as': 'whereas'
tests:
  - name: 'flags'
    input: "A is fast where as B is slow."
    contains: 'Voice.WhereAs'
  - name: 'clean'
    input: "A is fast whereas B is slow."
    absent: 'Voice.WhereAs'
