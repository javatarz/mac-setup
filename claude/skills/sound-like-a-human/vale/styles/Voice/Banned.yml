# Voices.Banned, minus "harness" (a word the user keeps; only "harness the power of" is banned, in Phrases).
extends: Voices.Banned
tokens-:
  - 'harness(?:es|ed|ing)?'
tests:
  - name: 'flags'
    input: "The realm of tapestry."
    contains: 'Voice.Banned'
  - name: 'harness is a keep-word'
    input: "We harness agents with a harness."
    absent: 'Voice.Banned'
