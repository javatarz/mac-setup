extends: occurrence
message: '"showcase" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:showcase)\b'
tests:
  - name: 'second use is flagged'
    input: "One showcase here.\n\nAnother showcase there."
    contains: 'Voice.RepeatedShowcase'
  - name: 'one use is fine'
    input: "One showcase here."
    absent: 'Voice.RepeatedShowcase'
