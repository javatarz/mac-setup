# "unleash" is allowed once per piece. From the second use it is flagged. The vendored rules that flag
# every use of it are derived in Voice/ without it.
extends: occurrence
message: '"unleash" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:unleash(?:es|ed|ing)?)\b'
tests:
  - name: 'second use is flagged'
    input: "One unleash here.\n\nAnother unleash there."
    contains: 'Voice.OnceUnleash'
  - name: 'one use is fine'
    input: "One unleash here."
    absent: 'Voice.OnceUnleash'
