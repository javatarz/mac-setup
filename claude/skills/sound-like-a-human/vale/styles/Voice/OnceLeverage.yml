# "leverage" is allowed once per piece. From the second use it is flagged. The vendored rules that flag
# every use of it are derived in Voice/ without it.
extends: occurrence
message: '"leverage" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:leverage[sd]?|leveraging)\b'
tests:
  - name: 'second use is flagged'
    input: "One leverage here.\n\nAnother leverage there."
    contains: 'Voice.OnceLeverage'
  - name: 'one use is fine'
    input: "One leverage here."
    absent: 'Voice.OnceLeverage'
