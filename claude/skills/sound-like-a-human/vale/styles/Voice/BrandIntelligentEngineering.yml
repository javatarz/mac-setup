extends: existence
message: 'Write "intelligent Engineering" (lowercase i, capital E), even at the start of a sentence.'
level: error
ignorecase: false
raw:
  - '\b(?:Intelligent [Ee]ngineering|intelligent engineering|INTELLIGENT ENGINEERING)\b'
tests:
  - name: 'flags'
    input: "Intelligent Engineering helps."
    contains: 'Voice.BrandIntelligentEngineering'
  - name: 'correct'
    input: "intelligent Engineering helps."
    absent: 'Voice.BrandIntelligentEngineering'
