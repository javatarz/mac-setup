extends: occurrence
message: '"innovative" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:innovative)\b'
tests:
  - name: 'second use is flagged'
    input: "One innovative here.\n\nAnother innovative there."
    contains: 'Voice.RepeatedInnovative'
  - name: 'one use is fine'
    input: "One innovative here."
    absent: 'Voice.RepeatedInnovative'
