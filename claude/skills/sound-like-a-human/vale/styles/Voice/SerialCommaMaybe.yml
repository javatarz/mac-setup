extends: existence
message: 'If this is a list, add the serial comma: "tests, lint, and review".'
level: suggestion
ignorecase: true
raw:
  - '\b(?!(?:however|so|then|also|now|yes|no|well|first|second|finally|thus|again|today|here|there)\b)[\w''-]+, (?!(?:is|was|are|were|be|been|has|had|have|made|gotten|got|which|who|that|but|it|this|they|we|you|i|he|she)\b)[\w''-]+(?: [\w''-]+)? (?:and|or) [\w''-]+'
tests:
  - name: 'flags'
    input: "We use tests, lint and review on every card."
    contains: 'Voice.SerialCommaMaybe'
  - name: 'however'
    input: "However, it made things harder and harder."
    absent: 'Voice.SerialCommaMaybe'
