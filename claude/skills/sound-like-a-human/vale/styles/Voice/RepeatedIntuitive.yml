extends: occurrence
message: '"intuitive" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:intuitive)\b'
tests:
  - name: 'second use is flagged'
    input: "One intuitive here.\n\nAnother intuitive there."
    contains: 'Voice.RepeatedIntuitive'
  - name: 'one use is fine'
    input: "One intuitive here."
    absent: 'Voice.RepeatedIntuitive'
