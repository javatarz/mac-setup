# "empower" is allowed once per piece. From the second use it is flagged. The vendored rules that flag
# every use of it are derived in Voice/ without it.
extends: occurrence
message: '"empower" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:empower(?:s|ed|ing|ment)?)\b'
tests:
  - name: 'second use is flagged'
    input: "One empower here.\n\nAnother empower there."
    contains: 'Voice.OnceEmpower'
  - name: 'one use is fine'
    input: "One empower here."
    absent: 'Voice.OnceEmpower'
