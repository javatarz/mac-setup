extends: occurrence
message: '"comprehensive" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:comprehensive)\b'
tests:
  - name: 'second use is flagged'
    input: "One comprehensive here.\n\nAnother comprehensive there."
    contains: 'Voice.RepeatedComprehensive'
  - name: 'one use is fine'
    input: "One comprehensive here."
    absent: 'Voice.RepeatedComprehensive'
