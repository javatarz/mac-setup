extends: substitution
message: 'British spelling: use "%s", not "%s".'
level: warning
ignorecase: true
swap:
  'behaviors?': 'behaviour'
  'colors?': 'colour'
  'favorites?': 'favourite'
  'centers?': 'centre'
  'honors?': 'honour'
  'labors?': 'labour'
  'neighbors?': 'neighbour'
  'flavors?': 'flavour'
  'catalogs?': 'catalogue'
  'modelings?': 'modelling'
  'labeleds?': 'labelled'
  'labelings?': 'labelling'
  'canceleds?': 'cancelled'
  'cancelings?': 'cancelling'
  'traveleds?': 'travelled'
  'fulfills?': 'fulfil'
  'enrolls?': 'enrol'
  'defenses?': 'defence'
  'offenses?': 'offence'
  'grays?': 'grey'
tests:
  - name: 'flags'
    input: "The behavior changed."
    contains: 'Voice.BritishWords'
  - name: 'clean'
    input: "The behaviour changed."
    absent: 'Voice.BritishWords'
