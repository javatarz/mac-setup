extends: existence
message: 'British spelling: "%s" should use -is-/-ys- (organise, optimisation, analyse).'
level: warning
ignorecase: true
raw:
  - '\b\w*(?:organiz|optimiz|prioritiz|realiz|recogniz|summariz|standardiz|customiz|normaliz|minimiz|maximiz|categoriz|emphasiz|apologiz|utiliz|authoriz|visualiz|initializ|serializ|containeriz|modulariz|analyz)(?:e|es|ed|ing|er|ers|ation|ations)\b'
tests:
  - name: 'flags'
    input: "We optimized the build."
    contains: 'Voice.BritishStems'
  - name: 'clean'
    input: "We optimised the build and resized it."
    absent: 'Voice.BritishStems'
