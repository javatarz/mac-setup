# End on a recommendation, not a summary.
extends: existence
message: 'Summary marker "%s". End on a recommendation instead.'
level: suggestion
ignorecase: true
tokens:
  - 'in conclusion'
  - 'to summari[sz]e'
  - 'to sum up'
  - 'in summary'
  - 'to conclude'
  - 'all in all'
  - 'in closing'
tests:
  - name: 'flags'
    input: "In conclusion, we are done."
    contains: 'Voice.SummaryMarker'
  - name: 'plain'
    input: "Start with the smallest change."
    absent: 'Voice.SummaryMarker'
