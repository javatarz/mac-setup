extends: occurrence
message: '"compelling" used more than once. Fine once.'
level: warning
scope: summary
max: 1
ignorecase: true
token: '\b(?:compelling)\b'
tests:
  - name: 'second use is flagged'
    input: "One compelling here.\n\nAnother compelling there."
    contains: 'Voice.RepeatedCompelling'
  - name: 'one use is fine'
    input: "One compelling here."
    absent: 'Voice.RepeatedCompelling'
